<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="OpsDesk home">
      <span class="brand-mark">O</span>
      <span class="brand-name">ops<span>desk</span></span>
    </a>

    <div class="workspace-label">WORKSPACE</div>
    <div class="workspace-switcher">
      <span class="workspace-avatar">S</span>
      <span class="workspace-copy">
        <strong>Support team</strong>
        <small>Operations workspace</small>
      </span>
      <span class="switcher-arrow">⌄</span>
    </div>

    <div class="nav-label">WORKSPACE</div>

    <nav class="navigation" aria-label="Main navigation">
      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon">▦</span>
        <span>Overview</span>
      </a>
    
      <a
        class="nav-item"
        routerLink="/tickets"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon">▤</span>
        <span>All tickets</span>
        
      </a>

      <a
        class="nav-item"
        routerLink="/customers"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon">♙</span>
        <span>Customers</span>
      </a>

      <a
        class="nav-item"
        routerLink="/reports"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon">▥</span>
        <span>Reports</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="help-card">
        <span class="help-icon">?</span>
        <strong>Need a hand?</strong>
        <p>Visit the support guide to learn how OpsDesk works.</p>
        <a href="https://angular.dev" target="_blank" rel="noopener noreferrer">
          View documentation ↗
        </a>
      </div>
      <div class="profile">
        <div class="profile-avatar">KA</div>
        <div class="profile-copy">
          <strong>Support Admin</strong>
          <small>Administrator</small>
        </div>
        <span class="profile-menu">···</span>
      </div>
    </div>
  </aside>

  <main class="main-panel">
    <header class="topbar">
      <div class="breadcrumb">
        <span>Workspace</span>
        <span class="breadcrumb-separator">/</span>
        <strong>{{ currentPageTitle }}</strong>
      </div>
      <div class="topbar-actions">
        <span class="environment"><span></span> Development</span>
        <button class="icon-button" type="button" aria-label="Notifications">♧</button>
        <div class="topbar-avatar">KA</div>
      </div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
